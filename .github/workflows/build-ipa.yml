name: CSigner derle

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: sade-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test et ve IPA üret
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      TERM: xterm
      SOURCE_ARCHIVE_SHA256: 49e4153aa63bfa38dfdf080eb5567303096deef0169b299e38f7e3f9e67536b7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Kaynak paketini doğrula ve aç
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path('.').glob('CSigner-Cloud.part*.b64'))
          if not parts:
              raise SystemExit('CSigner kaynak paketi bulunamadı.')
          encoded = ''.join(''.join(part.read_text(encoding='ascii').split()) for part in parts)
          Path('CSigner-Cloud.zip').write_bytes(base64.b64decode(encoded, validate=True))
          PY
          echo "${SOURCE_ARCHIVE_SHA256}  CSigner-Cloud.zip" | shasum -a 256 --check
          unzip -q CSigner-Cloud.zip -d "$RUNNER_TEMP/csigner"

      - name: Xcode seç
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4.1"

      - name: Paketleme aracını kur
        run: |
          if ! command -v ldid >/dev/null; then
            brew install ldid
          fi

      - name: Sabitlenmiş kaynakları hazırla
        working-directory: ${{ runner.temp }}/csigner/CSigner-Cloud
        run: python3 scripts/fetch-upstream.py

      - name: Sayaç testleri ve iOS derlemesi
        working-directory: ${{ runner.temp }}/csigner/CSigner-Cloud
        run: bash scripts/build-macos.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: IPA dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: CSigner
          path: |
            ${{ runner.temp }}/csigner/CSigner-Cloud/build/CSigner.ipa
            ${{ runner.temp }}/csigner/CSigner-Cloud/build/SHA256SUMS.txt
            ${{ runner.temp }}/csigner/CSigner-Cloud/build/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7

      - name: Derleme günlüğünü sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CSigner-derleme-gunlugu
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Sonucu göster
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## IPA üretildi
          **Artifacts → CSigner** paketini indir ve ZIP dosyasını aç.
          **CSigner.ipa** dosyasını Windows'ta iloader ile kendi Apple hesabın kullanılarak imzala ve kur.
          iPhone 16 / iOS 27.0.1 cihaz testi ayrıca yapılmalıdır.
          SUMMARY
